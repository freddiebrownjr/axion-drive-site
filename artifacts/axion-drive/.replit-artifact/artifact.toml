kind = "web"
previewPath = "/"
title = "Axion Drive Group"
version = "1.0.0"
id = "artifacts/axion-drive"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18282

[services.development]
run = "pnpm --filter @workspace/axion-drive run dev"

[services.production]
build = [ "npm", "run", "build" ]
publicDir = "dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18282"
BASE_PATH = "/"
